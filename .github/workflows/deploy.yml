name: Deploy Theme to Server (Changed Files Only)

on:
  push:
    branches:
      - dev

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v3

      # Restore previous FTP deploy state (so it can detect changes)
      - name: Restore FTP deploy state
        uses: actions/cache@v3
        with:
          path: .ftp-deploy-theme-state.json
          key: ftp-theme-state-${{ github.ref }}
          restore-keys: |
            ftp-theme-state-

      # Upload theme (only changed files)
      - name: Upload theme via FTP
        uses: SamKirkland/FTP-Deploy-Action@v4.3.4
        with:
          server: ${{ secrets.SERVER_HOST }}
          username: ${{ secrets.SERVER_USER }}
          password: ${{ secrets.SERVER_SSH_PASSWORD }}
          port: ${{ secrets.SSH_PORT }}
          local-dir: ./themes/portfolio_theme/
          server-dir: htdocs/wp-content/themes/portfolio_theme/
          state-name: .ftp-deploy-theme-state.json
          method: sync
          exclude: |
            **/.git*
            **/.DS_Store
            **/node_modules/**

      # Save updated state for next run
      - name: Save FTP deploy state
        uses: actions/cache@v3
        with:
          path: .ftp-deploy-theme-state.json
          key: ftp-theme-state-${{ github.ref }}
